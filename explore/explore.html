<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Divine Uttarakhand</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f5f7fb;
    color: #333;
  }

  /* 🔥 PREMIUM HERO HEADER */
   h1 {
  text-align: center;
  padding: 3rem 1rem;
  background: linear-gradient(
      rgba(255, 153, 51, 0.9),
      rgba(255, 106, 0, 0.9)
    ),
    url("uttarakhand-bg.jpg");

  background-size: cover;
  background-position: center;
  color: #fff;
}


  /* ✨ Subtitle under heading (optional if you add <p>) */
    h1::after {
      content: "Explore temples, rivers & Himalayan beauty";
      display: block;
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0.9;
    }


  /* 🌄 GRID */
  .monasteries-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    justify-content: center;
    padding: 40px 20px;
  }

  /* 🧊 PREMIUM CARD */
  .monastery-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    width: 300px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 15px;
    transition: all 0.3s ease;
    text-align: center;
    overflow: hidden;
  }

  .monastery-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  }

  /* 🖼 IMAGE */
  .monastery-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 12px;
    transition: 0.3s;
  }

  .monastery-card:hover img {
    transform: scale(1.05);
  }

  /* 🏷 TEXT */
  .monastery-card h3 {
    margin: 8px 0;
    color: #0b3d91;
    font-size: 1.2rem;
  }

  .monastery-card p {
    margin: 4px 0;
    font-size: 0.95rem;
    color: #555;
  }

  /* 🔘 BUTTONS */
  .buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    padding: 8px 14px;
    background: linear-gradient(135deg, #0b3d91, #1e5bd8);
    color: rgb(231, 225, 220);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s ease;
    font-size: 0.9rem;
  }

  button:hover {
    background: linear-gradient(135deg, #062a66, #1440a0);
    transform: scale(1.07);
  }

  /* 🗺 MAP */
  .map-container iframe {
    margin-top: 12px;
    border-radius: 14px;
    height: 200px;
    width: 100%;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }

  /* 📱 RESPONSIVE */
  @media (max-width: 768px) {
    h1 {
      font-size: 1.8rem;
      padding: 60px 15px 30px;
    }

    .monastery-card {
      width: 90%;
    }
  }
</style>
</head>

<body>

<h1>🏔️ Discover Uttarakhand – Devbhoomi</h1>

<div class="monasteries-grid" id="grid"></div>

<script>

const places = [

  // 🔱 CHAR DHAM
  { name:"Kedarnath Temple", location:"Rudraprayag", rating:4.9, sect:"Shiva Jyotirlinga", img:"kedarnath.jpg", url:"https://en.wikipedia.org/wiki/Kedarnath_Temple", lat:30.7352, lng:79.0669 },
  { name:"Badrinath Temple", location:"Chamoli", rating:4.9, sect:"Lord Vishnu", img:"badrinath.jpg", url:"https://en.wikipedia.org/wiki/Badrinath_Temple", lat:30.7433, lng:79.4938 },
  { name:"Gangotri Temple", location:"Uttarkashi", rating:4.8, sect:"Ganga Origin", img:"gangotri.jpg", url:"https://en.wikipedia.org/wiki/Gangotri", lat:30.9947, lng:78.9398 },
  { name:"Yamunotri Temple", location:"Uttarkashi", rating:4.8, sect:"Yamuna Origin", img:"yamunotri.jpg", url:"https://en.wikipedia.org/wiki/Yamunotri", lat:31.0140, lng:78.4590 },

  // 🔱 SHIVA & TEMPLE CIRCUITS
  { name:"Tungnath Temple", location:"Rudraprayag", rating:4.9, sect:"Highest Shiva Temple", img:"tungnath.jpg", url:"https://en.wikipedia.org/wiki/Tungnath", lat:30.4890, lng:79.2160 },
  { name:"Neelkanth Mahadev", location:"Rishikesh", rating:4.8, sect:"Shiva Temple", img:"neelkanth.jpg", url:"https://en.wikipedia.org/wiki/Neelkanth_Mahadev_Temple", lat:30.1357, lng:78.3222 },
  { name:"Jageshwar Dham", location:"Almora", rating:4.7, sect:"Ancient Temples", img:"jageshwar.jpg", url:"https://en.wikipedia.org/wiki/Jageshwar", lat:29.6390, lng:79.8500 },

  // 🛕 HARIDWAR & RISHIKESH
  { name:"Har Ki Pauri", location:"Haridwar", rating:4.9, sect:"Ganga Aarti", img:"haridwar.jpg", url:"https://en.wikipedia.org/wiki/Har_Ki_Pauri", lat:29.9457, lng:78.1642 },
  { name:"Laxman Jhula", location:"Rishikesh", rating:4.8, sect:"Spiritual Bridge", img:"rishikesh.jpg", url:"https://en.wikipedia.org/wiki/Laxman_Jhula", lat:30.1300, lng:78.3210 },

  // 🌄 HILL STATIONS
  { name:"Nainital Lake", location:"Nainital", rating:4.8, sect:"Lake Tourism", img:"nainital.jpg", url:"https://en.wikipedia.org/wiki/Nainital_Lake", lat:29.3919, lng:79.4542 },
  { name:"Mussoorie Mall Road", location:"Mussoorie", rating:4.7, sect:"Hill Station", img:"mussoorie.jpg", url:"https://en.wikipedia.org/wiki/Mussoorie", lat:30.4598, lng:78.0644 },
  { name:"Auli", location:"Chamoli", rating:4.8, sect:"Ski Destination", img:"auli.jpg", url:"https://en.wikipedia.org/wiki/Auli,_India", lat:30.5280, lng:79.5650 },

  // 🌊 LAKES & NATURE
  { name:"Bhimtal Lake", location:"Nainital", rating:4.7, sect:"Lake", img:"bhimtal.jpg", url:"https://en.wikipedia.org/wiki/Bhimtal", lat:29.3440, lng:79.5630 },
  { name:"Valley of Flowers", location:"Chamoli", rating:4.9, sect:"UNESCO Site", img:"valley.jpg", url:"https://en.wikipedia.org/wiki/Valley_of_Flowers_National_Park", lat:30.7280, lng:79.6050 },
  { name:"Hemkund Sahib", location:"Chamoli", rating:4.9, sect:"Sikh Pilgrimage", img:"hemkund.jpg", url:"https://en.wikipedia.org/wiki/Hemkund", lat:30.7260, lng:79.6150 }

];

const grid = document.getElementById("grid");

function toggleMap(button, lat, lng) {
  const container = button.parentElement.nextElementSibling;

  if (container.innerHTML !== "") {
    container.innerHTML = "";
    button.innerText = "View 360°";
    return;
  }

  container.innerHTML = `
    <iframe
      src="https://www.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=11,0,0,0,0&output=svembed"
      width="100%"
      height="220"
      style="border:0;"
      loading="lazy">
    </iframe>
  `;

  button.innerText = "Close View";
}

places.forEach(p => {
  const card = document.createElement("div");
  card.className = "monastery-card";

  card.innerHTML = `
    <img src="${p.img}">
    <h3>${p.name}</h3>
    <p><strong>Location:</strong> ${p.location}</p>
    <p><strong>Type:</strong> ${p.sect}</p>
    <p><strong>Rating:</strong> ${p.rating} ★</p>

    <div class="buttons">
      <a href="${p.url}" target="_blank">
        <button>More Info</button>
      </a>
      <button onclick="toggleMap(this, ${p.lat}, ${p.lng})">
        View 360°
      </button>
    </div>

    <div class="map-container"></div>
  `;

  grid.appendChild(card);
});

</script>

</body>
</html>
