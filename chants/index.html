<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Himalayan Culture - Uttarakhand</title>

<style>

/* THEME COLORS */
:root{
  --saffron:#FF9933;
  --white:#ffffff;
  --light:#fff7ef;
  --dark:#5a2d0c;
}

/* BODY */
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--saffron), var(--white));
  color:var(--dark);
}

/* TITLE */
h1{
  text-align:center;
  padding:20px;
  color:var(--white);
  text-shadow:2px 2px 6px rgba(0,0,0,0.4);
}

/* CARD GRID */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

/* CARDS */
.card{
  width:230px;
  background:rgba(255,255,255,0.9);
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

.card:hover{
  transform:translateY(-10px);
}

/* IMAGE PLACEHOLDER */
.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#ddd;
}

/* TITLE */
.card h3{
  padding:12px;
  text-align:center;
  color:var(--dark);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--white);
  padding:20px;
  width:90%;
  max-width:600px;
  border-radius:15px;
  max-height:85%;
  overflow-y:auto;
  position:relative;
}

/* CLOSE BUTTON */
.close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:22px;
  cursor:pointer;
  color:red;
}

.modal h2{
  color:var(--saffron);
}

.modal p{
  margin-bottom:10px;
}

</style>
</head>

<body>

<h1>🛕 Himalayan Culture of Uttarakhand 🏔️</h1>

<div class="container" id="container"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modalData"></div>
  </div>
</div>

<script>

/* DATA */
const cultures = [

{
  name:"Folk Dance (Chholiya)",
  img:"",
  info:`
  <p><b>Region:</b> Kumaon</p>
  <p>Chholiya is a traditional sword dance performed in weddings and festivals.</p>
  <p>It represents bravery and warrior spirit.</p>
  <p><b>Instruments:</b> Dhol, Damau, Turri</p>
  `
},

{
  name:"Pandav Nritya",
  img:"",
  info:`
  <p><b>Origin:</b> Garhwal</p>
  <p>This dance narrates stories of the Mahabharata.</p>
  <p>Villagers perform it with deep devotion and storytelling.</p>
  `
},

{
  name:"Traditional Dress",
  img:"",
  info:`
  <p><b>Women:</b> Ghagra, Pichora</p>
  <p><b>Men:</b> Kurta, Dhoti, Topi</p>
  <p>Pichora is worn in weddings and religious rituals.</p>
  `
},

{
  name:"Festivals",
  img:"",
  info:`
  <p><b>Major Festivals:</b></p>
  <ul>
    <li>Kumbh Mela (Haridwar)</li>
    <li>Harela Festival</li>
    <li>Nanda Devi Raj Jat Yatra</li>
  </ul>
  <p>These festivals reflect spirituality and nature worship.</p>
  `
},

{
  name:"Local Cuisine",
  img:"",
  info:`
  <p><b>Famous Dishes:</b></p>
  <ul>
    <li>Kafuli</li>
    <li>Chainsoo</li>
    <li>Aloo Ke Gutke</li>
  </ul>
  <p>Food is simple, nutritious and made from local ingredients.</p>
  `
},

{
  name:"Temples & Spirituality",
  img:"",
  info:`
  <p>Uttarakhand is called <b>Devभूमि</b> (Land of Gods).</p>
  <p><b>Famous Temples:</b></p>
  <ul>
    <li>Kedarnath</li>
    <li>Badrinath</li>
    <li>Gangotri</li>
    <li>Yamunotri</li>
  </ul>
  `
},

{
  name:"Music & Instruments",
  img:"",
  info:`
  <p>Music plays a big role in traditions.</p>
  <p><b>Instruments:</b></p>
  <ul>
    <li>Dhol</li>
    <li>Damau</li>
    <li>Ransingha</li>
  </ul>
  `
},

{
  name:"Fairs (Melas)",
  img:"",
  info:`
  <p><b>Popular Melas:</b></p>
  <ul>
    <li>Nanda Devi Mela</li>
    <li>Magh Mela</li>
    <li>Uttarayani Mela</li>
  </ul>
  <p>These fairs include trade, dance and rituals.</p>
  `
},

{
  name:"Yoga & Meditation",
  img:"",
  info:`
  <p>Rishikesh is known as the <b>Yoga Capital of the World</b>.</p>
  <p>People come globally for meditation and spiritual learning.</p>
  `
},

{
  name:"Handicrafts",
  img:"",
  info:`
  <p><b>Popular Crafts:</b></p>
  <ul>
    <li>Ringaal Bamboo Craft</li>
    <li>Wood Carving</li>
    <li>Woolen Shawls</li>
  </ul>
  `
}

];

/* LOAD CARDS */
const container = document.getElementById("container");

cultures.forEach((c,i)=>{
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <img src="${c.img}">
    <h3>${c.name}</h3>
  `;

  card.onclick = ()=>openModal(i);

  container.appendChild(card);
});

/* MODAL */
function openModal(i){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalData").innerHTML =
    `<h2>${cultures[i].name}</h2>${cultures[i].info}`;
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* CLOSE ON OUTSIDE CLICK */
window.onclick = function(e){
  if(e.target.id==="modal"){
    closeModal();
  }
}

</script>

</body>
</html>
