<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saints of Uttarakhand 🔱</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 20px;
  background: url('https://images.unsplash.com/photo-1580655653885-65763b2597d0?q=80&w=1920') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
  color: #d4ffce;
}

/* Cards */
.card-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.card {
  background: rgba(0, 50, 20, 0.3);
  border-radius: 15px;
  width: 240px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  transition: 0.3s;
}
.card:hover {
  transform: translateY(-8px);
}

.card img {
  width: 240px;
  height: 220px;
  object-fit: cover;
  border-radius: 15px 15px 0 0;
}

.card h3 {
  text-align: center;
  padding: 10px;
  color: #b6ffb3;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: rgba(0,40,10,0.6);
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 700px;
  max-height: 90%;
  overflow-y: auto;
}

.close {
  float: right;
  font-size: 25px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🕉️ Saints & Sadhus of Uttarakhand 🔱</h1>

<div class="card-container" id="cards"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modalData"></div>
  </div>
</div>

<script>

const saints = [

{
name: "Neem Karoli Baba",
img: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Neem_Karoli_Baba.jpg",
info: `
<p><b>Born:</b> 1900, Uttar Pradesh</p>
<p><b>Ashram:</b> Kainchi Dham, Nainital</p>
<p><b>Teachings:</b> Love, devotion, service (Seva)</p>
<ul>
<li>Spiritual guru of Steve Jobs & Mark Zuckerberg</li>
<li>Known for miracles and divine presence</li>
<li>Established Kainchi Dham Ashram</li>
</ul>
<p><b>Legacy:</b> One of the most influential saints of modern India</p>
`
},

{
name: "Adi Shankaracharya",
img: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Adi_Shankara.jpg",
info: `
<p><b>Born:</b> 788 AD</p>
<p><b>Philosophy:</b> Advaita Vedanta</p>
<ul>
<li>Re-established Kedarnath Temple</li>
<li>Founded Char Dham pilgrimage</li>
<li>Unified Hindu philosophy</li>
</ul>
<p><b>Legacy:</b> Greatest spiritual philosopher of India</p>
`
},

{
name: "Swami Rama",
img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Swami_Rama.jpg",
info: `
<p><b>Ashram:</b> Rishikesh</p>
<ul>
<li>Yogi with scientific validation of meditation</li>
<li>Founder of Himalayan Institute</li>
<li>Bridged science and spirituality</li>
</ul>
`
},

{
name: "Maa Anandamayi",
img: "https://upload.wikimedia.org/wikipedia/commons/2/2f/Anandamayi_Ma.jpg",
info: `
<p><b>Born:</b> 1896</p>
<ul>
<li>Spent time in Dehradun & Haridwar</li>
<li>Known for divine bliss state</li>
<li>Had followers worldwide</li>
</ul>
`
},

{
name: "Trailanga Swami",
img: "https://upload.wikimedia.org/wikipedia/commons/9/98/Trailanga_Swami.jpg",
info: `
<p><b>Known as:</b> Walking Shiva</p>
<ul>
<li>Lived for over 200 years (legend)</li>
<li>Performed extreme yogic feats</li>
<li>Associated with Varanasi & Himalayas</li>
</ul>
`
},

{
name: "Baba Haidakhan",
img: "https://upload.wikimedia.org/wikipedia/commons/6/6b/Haidakhan_Baba.jpg",
info: `
<p><b>Ashram:</b> Kumaon region</p>
<ul>
<li>Believed to be incarnation of Lord Shiva</li>
<li>Taught truth, simplicity, love</li>
<li>Followers from all over the world</li>
</ul>
`
},

{
name: "Swami Sivananda",
img: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Swami_Sivananda.jpg",
info: `
<p><b>Founded:</b> Divine Life Society, Rishikesh</p>
<ul>
<li>Promoted yoga worldwide</li>
<li>Wrote 200+ books</li>
<li>Guru of many yoga masters</li>
</ul>
`
},

{
name: "Gopeshwar Mahadev Saints",
img: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Kedarnath_Temple.jpg",
info: `
<p><b>Region:</b> Garhwal Himalayas</p>
<ul>
<li>Ancient sages meditated here</li>
<li>Connected to Kedarnath spiritual lineage</li>
<li>Important Shaivite tradition</li>
</ul>
`
},

{
name: "Baba Kalyan Das",
img: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Sadhu_India.jpg",
info: `
<p><b>Region:</b> Haridwar</p>
<ul>
<li>Renowned for austerity and meditation</li>
<li>Practiced silence for years</li>
<li>Inspired many devotees</li>
</ul>
`
},

{
name: "Swami Vivekananda (Himalayan Journey)",
img: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Swami_Vivekananda.jpg",
info: `
<ul>
<li>Meditated in Almora & Himalayas</li>
<li>Spread Vedanta globally</li>
<li>Inspired youth spiritually</li>
</ul>
`
}

];

const container = document.getElementById("cards");

saints.forEach((s, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${s.img}">
    <h3>${s.name}</h3>
  `;
  card.onclick = () => openModal(i);
  container.appendChild(card);
});

function openModal(i){
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalData").innerHTML =
    `<h2>${saints[i].name}</h2>${saints[i].info}`;
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

window.onclick = function(e){
  if(e.target.id === "modal") closeModal();
}

</script>

</body>
</html>
